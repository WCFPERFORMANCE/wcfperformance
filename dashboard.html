<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCF Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  
body{
background:#0b0b0b;
color:white;
font-family:Inter,Arial;
margin:0;
padding:40px;
}
h1{
font-family:Orbitron;
margin-bottom:30px;
}
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:12px;
border-bottom:1px solid #222;
text-align:left;
}
th{
color:#888;
font-weight:500;
}
button{
padding:6px 10px;
margin-right:5px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
}
.wait{background:#444;color:white;}
.progress{background:#007bff;color:white;}
.payment{background:#ff9900;color:white;}
.ready{background:#00cc66;color:white;}
.status-badge{
padding:4px 8px;
border-radius:20px;
font-size:12px;
}
.status-waiting{background:#555;}
.status-progress{background:#007bff;}
.status-payment{background:#ff9900;}
.status-ready{background:#00cc66;}
</style>
</head>

<body>

<h1>WCF Admin Dashboard</h1>
  
<div style="margin-bottom:20px;font-size:18px">
Waiting : <span id="countWaiting">0</span> |
Processing : <span id="countProgress">0</span> |
Ready : <span id="countReady">0</span>
</div>

<table id="requestsTable">
<tr>
<th>Reference ID</th>
<th>Client</th>
<th>Email</th>
<th>Vehicle</th>
<th>Original File</th>
<th>Modified File</th>
<th>Status</th>
<th>Actions</th>
</tr>
</table>

  
<script>

/* 🔥 NOUVEAU PROJET */
const SUPABASE_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqaGZwZG1idXB6bndja3J2Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MDU3NzQsImV4cCI6MjA4NzI4MTc3NH0.JFjuVEV7bMzC3qXeQbFHkUA_YIZFkM16NBkrqdG5yXY";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
ANON_KEY
);

window.onload = () => {

  loadRequests();

  setInterval(loadRequests, 3000);

};
  
/* 🔥 EDGE FUNCTIONS */
const LIST_URL   = "https://rjhfpdmbupznwckrvcsv.supabase.co/functions/v1/admin-list";
const UPDATE_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co/functions/v1/update-status";
const UPLOAD_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co/functions/v1/upload-modified";


/* ========================= */
/* LOAD REQUESTS */
/* ========================= */
async function loadRequests(){
  
let waiting = 0;
let progress = 0;
let ready = 0;


const { data, error } = await supabaseClient
.from("ecu_requests")
.select("id,name,email,vehicle,ecu,solution,file,created_at,status")
.order("created_at", { ascending: false })

console.log(data);
console.log(error);

if(error){
  console.log(error);
  return;
}
  
const table = document.getElementById("requestsTable");
  
table.innerHTML = `
<tr>
<th>Reference ID</th>
<th>Client</th>
<th>Email</th>
<th>Vehicle</th>
<th>Original File</th>
<th>Modified File</th>
<th>Status</th>
<th>Actions</th>
</tr>
`;

data.forEach(n=>{
  
console.log("STATUS =", n.status);

if(n.status && n.status.toLowerCase() === "waiting"){waiting++;}
if(n.status && (n.status.toLowerCase() === "in progress" || n.status.toLowerCase() === "payment")){progress++;}
if(n.status && n.status.toLowerCase() === "ready"){ready++;}

let statusClass = "status-waiting";
  
if(n.status === "Waiting"){statusClass = "status-waiting";}
if(n.status === "In Progress"){statusClass = "status-progress";}
if(n.status === "Payment"){statusClass = "status-payment";}
if(n.status === "Ready"){statusClass = "status-ready";}

const row = table.insertRow();
  
row.innerHTML = `
<td>${n.id}</td>
<td>${n.name}</td>
<td>${n.email}</td>
<td>${n.vehicle}</td>
<td><button onclick="downloadFile('${n.file}')">Download</button></td>
<td><a href="${n.modified_file || '#'}" target="_blank">Modified</a></td>
<td><span class="status-badge ${statusClass}">${n.status}</span></td>
<td>
<button class="wait" onclick="updateStatus('${n.id}','Waiting')">Waiting</button>
<button class="progress" onclick="updateStatus('${n.id}','In Progress')">Processing</button>
<button class="payment" onclick="updateStatus('${n.id}','Payment')">Payment</button>
<button class="ready" onclick="triggerUpload('${n.id}')">Upload & Ready</button>
</td>
`;
});
const w = document.getElementById("countWaiting");
const p = document.getElementById("countProgress");
const r = document.getElementById("countReady");

if (w) w.innerText = waiting;
if (p) p.innerText = progress;
if (r) r.innerText = ready;
}

/* ========================= */
/* UPDATE STATUS */
/* ========================= */
async function updateStatus(id,status){

await fetch(UPDATE_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":ANON_KEY,
"Authorization":"Bearer " + ANON_KEY
},
body:JSON.stringify({id,status})
});

location.reload();
}

/* ========================= */
/* UPLOAD MODIFIED FILE */
/* ========================= */
async function triggerUpload(id){

const fileInput = document.createElement("input");
fileInput.type = "file";

fileInput.onchange = async function(){

const file = fileInput.files[0];
if(!file) return;

const formData = new FormData();
formData.append("file", file);
formData.append("id", id);

try {

const res = await fetch(UPLOAD_URL,{
method:"POST",
headers:{
"apikey": ANON_KEY,
"Authorization":"Bearer " + ANON_KEY
},
body:formData
});

const data = await res.json();

if(data.success){
alert("Upload successful ✅");
location.reload();
}else{
alert("Upload failed ❌\n\n" + JSON.stringify(data));
}

} catch(err){
console.error(err);
alert("Network error ❌");
}

};

fileInput.click();
}

async function downloadFile(fileName) {

const { data, error } = await supabaseClient
.storage
.from('ecu-files')
.createSignedUrl(fileName, 60)

if(error){
console.log(error)
alert("Download error")
return
}

window.open(data.signedUrl, "_blank")

}

</script>

</body>
</html>
