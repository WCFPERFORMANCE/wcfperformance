<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WCF Admin</title>
<style>
body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial;
color:white;
}

.box{
background:#111;
padding:40px;
border-radius:10px;
width:320px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
background:#1a1a1a;
border:1px solid #333;
color:white;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#ff2a2a;
border:none;
color:white;
font-weight:bold;
border-radius:6px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>WCF Admin</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">LOGIN</button>
<p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqaGZwZG1idXB6bndja3J2Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MDU3NzQsImV4cCI6MjA4NzI4MTc3NH0.JFjuVEV7bMzC3qXeQbFHkUA_YIZFkM16NBkrqdG5yXY";

  window.location.href = "dashboard.html";
});
