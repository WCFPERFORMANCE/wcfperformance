<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WCF Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
font-family:Arial;
}
.box{
background:#111;
padding:40px;
border-radius:12px;
width:300px;
text-align:center;
}
input{
width:100%;
padding:10px;
margin:10px 0;
background:#222;
border:none;
color:white;
}
button{
width:100%;
padding:10px;
background:#ff2a2a;
border:none;
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>WCF Admin</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="error" style="color:red;"></p>
</div>

<script>
const SUPABASE_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co";
const ANON_KEY = "TON_ANON_KEY_ICI";

const supabase = supabase.createClient(SUPABASE_URL, ANON_KEY);

async function login(){
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const { error } = await supabase.auth.signInWithPassword({
email,
password
});

if(error){
document.getElementById("error").innerText = "Login failed";
}else{
window.location.href = "dashboard.html";
}
}
</script>

</body>
</html>
