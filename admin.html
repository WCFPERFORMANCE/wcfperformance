<!DOCTYPE html>
<html>
<head>
<title>WCF Admin Login</title>
<style>
body{
background:#0b0b0b;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}
.box{
background:#121212;
padding:40px;
border-radius:12px;
width:300px;
text-align:center;
}
input{
width:100%;
padding:10px;
margin-top:15px;
background:#0f0f0f;
border:1px solid #222;
color:white;
}
button{
margin-top:20px;
padding:10px;
width:100%;
background:#ff2a2a;
border:none;
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>WCF Admin</h2>
<input type="password" id="pass" placeholder="Enter password">
<button onclick="login()">LOGIN</button>
<p id="error"></p>
</div>

<script>
const PASSWORD = "WCF2026Secure";

function login(){
const p = document.getElementById("pass").value;
if(p === PASSWORD){
localStorage.setItem("wcf_admin","true");
window.location.href = "dashboard.html";
}else{
document.getElementById("error").innerText="Wrong password";
}
}
</script>

</body>
</html>
