<script>

// NAVIGATION
function openFileService() {
  document.getElementById("dashboardView").classList.add("hidden");
  document.getElementById("fileServiceView").classList.remove("hidden");
}

function backToDashboard() {
  document.getElementById("fileServiceView").classList.add("hidden");
  document.getElementById("dashboardView").classList.remove("hidden");
}

// FORM
const FUNCTION_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co/functions/v1/super-worker";

const form = document.getElementById("fileForm");
const statusBox = document.getElementById("statusMsg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  statusBox.innerText = "Sending request...";

  const data = {
    name: form.name.value,
    email: form.email.value,
    vehicle: form.vehicle.value,
    ecu: form.ecu.value,
    service: "File Service"
  };

  try {
    const res = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (result.success) {

      const message = `
WCF PERFORMANCE REQUEST

Name: ${data.name}
Email: ${data.email}
Vehicle: ${data.vehicle}
ECU: ${data.ecu}
Service: File Service

Reference ID: ${result.publicId || "Pending"}

Thank you.
      `;

      const whatsappURL = "https://wa.me/33664784160?text=" + encodeURIComponent(message);

      statusBox.innerText = "Redirecting to WhatsApp...";

      setTimeout(() => {
        window.location.href = whatsappURL;
      }, 700);

    } else {
      statusBox.innerText = "Server error";
    }

  } catch (err) {
    statusBox.innerText = "Server offline";
    console.error(err);
  }
});
</script>
