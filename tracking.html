<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCF Request Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
background:#0b0b0b;
color:white;
font-family:Inter,Arial;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.engineer-status {
position: fixed;
top: 20px;
right: 20px;
background: rgba(0,0,0,0.7);
backdrop-filter: blur(10px);
border: 1px solid rgba(0,255,136,0.3);
padding: 8px 14px;
border-radius: 30px;
font-size: 12px;
color: #00ff88;
display: flex;
align-items: center;
gap: 8px;
z-index: 9999;
box-shadow: 0 0 15px rgba(0,255,136,0.2);
}

.engineer-dot {
width: 10px;
height: 10px;
background: #00ff88;
border-radius: 50%;
box-shadow: 0 0 10px #00ff88;
animation: pulse 1.5s infinite;
}

@keyframes pulse {
0% { box-shadow: 0 0 5px #00ff88; }
50% { box-shadow: 0 0 20px #00ff88; }
100% { box-shadow: 0 0 5px #00ff88; }
}

.container{
background:#121212;
padding:40px;
border-radius:16px;
width:450px;
text-align:center;
border:1px solid #1f1f1f;
}

h1{
font-family:Orbitron;
margin-bottom:10px;
}

input{
width:100%;
padding:14px;
margin-top:20px;
background:#0f0f0f;
border:1px solid #222;
color:white;
border-radius:8px;
text-align:center;
}

button{
margin-top:20px;
padding:14px;
width:100%;
background:#ff2a2a;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
}

.status-box{
margin-top:25px;
font-size:16px;
}

.download-btn{
display:inline-block;
margin-top:20px;
padding:14px 25px;
background:#00cc66;
color:white;
border-radius:8px;
text-decoration:none;
font-weight:600;
box-shadow:0 0 20px rgba(0,255,136,0.4);
transition:0.3s;
}

.download-btn:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(0,255,136,0.7);
}

.back{
margin-top:25px;
display:inline-block;
color:#ff2a2a;
cursor:pointer;
font-size:14px;
}

/* PROGRESS */

.progress-wrapper {
margin-top: 40px;
position: relative;
}

.progress-line {
position: absolute;
top: 20px;
left: 0;
height: 4px;
width: 100%;
background: #333;
border-radius: 10px;
}

.progress-fill {
position: absolute;
top: 20px;
left: 0;
height: 4px;
width: 0%;
background: linear-gradient(90deg,#ff2a2a,#ff0000);
box-shadow: 0 0 15px #ff2a2a;
border-radius: 10px;
transition: width 0.6s ease;
}

.progress-steps {
display: flex;
justify-content: space-between;
position: relative;
}

.step {
text-align: center;
width: 25%;
position: relative;
z-index: 2;
}

.step-circle {
width: 35px;
height: 35px;
border-radius: 50%;
background: #222;
border: 2px solid #444;
margin: 0 auto;
transition: 0.4s;
}

.step.active .step-circle {
background: #ff2a2a;
border-color: #ff2a2a;
box-shadow: 0 0 20px #ff2a2a;
}

.step.completed .step-circle {
background: #00ff88;
border-color: #00ff88;
box-shadow: 0 0 20px #00ff88;
}

.step-label {
margin-top: 10px;
font-size: 12px;
color: #ccc;
letter-spacing: 1px;
}

.step.active .step-label {
color: #ff2a2a;
}

.step.completed .step-label {
color: #00ff88;
}
</style>
</head>

<body>

<div class="engineer-status">
<div class="engineer-dot"></div>
Engineers Online 24/7
</div>

<div class="container">

<h1>Track Your Request</h1>

<p>Enter your Reference ID</p>

<input type="text" id="refId" placeholder="e.g. 1c6312a3">
<button onclick="checkStatus()">CHECK STATUS</button>

<div class="status-box" id="statusBox"></div>

<div id="progressSection" style="display:none;">
<div class="progress-wrapper">
<div class="progress-line"></div>
<div class="progress-fill" id="progressFill"></div>

<div class="progress-steps">
<div class="step" id="step1">
<div class="step-circle"></div>
<div class="step-label">Received</div>
</div>

<div class="step" id="step2">
<div class="step-circle"></div>
<div class="step-label">Processing</div>
</div>

<div class="step" id="step3">
<div class="step-circle"></div>
<div class="step-label">Payment</div>
</div>

<div class="step" id="step4">
<div class="step-circle"></div>
<div class="step-label">Completed</div>
</div>
</div>
</div>
</div>

<div class="back" onclick="goBack()">← Back to Portal</div>

</div>

<script>

const CHECK_URL = "https://rjhfpdmbupznwckrvcsv.supabase.co/functions/v1/check-status";

async function checkStatus(){

const ref = document.getElementById("refId").value.trim();
if(!ref){return;}

document.getElementById("statusBox").innerHTML = "Checking...";

try{

const res = await fetch(CHECK_URL + "?ref=" + ref);
const data = await res.json();

if(data.status){

let html = `Status: <strong>${data.status}</strong>`;

if(data.status === "Ready" && data.download_url){
html += `
<br>
<a href="${data.download_url}" target="_blank" class="download-btn">
Download Your File
</a>
`;
}

document.getElementById("statusBox").innerHTML = html;

updateProgress(data.status);

}else{
document.getElementById("statusBox").innerHTML = "Request not found";
}

}catch(err){
document.getElementById("statusBox").innerHTML = "Error checking status";
}
}

function updateProgress(status){

document.getElementById("progressSection").style.display = "block";

const steps = ["step1","step2","step3","step4"];
steps.forEach(step=>{
document.getElementById(step).classList.remove("active","completed");
});

let progressWidth = 0;

if(status==="Waiting"){
document.getElementById("step1").classList.add("active");
progressWidth=10;
}

if(status==="In Progress"){
document.getElementById("step1").classList.add("completed");
document.getElementById("step2").classList.add("active");
progressWidth=40;
}

if(status==="Payment"){
document.getElementById("step1").classList.add("completed");
document.getElementById("step2").classList.add("completed");
document.getElementById("step3").classList.add("active");
progressWidth=70;
}

if(status==="Ready"){
document.getElementById("step1").classList.add("completed");
document.getElementById("step2").classList.add("completed");
document.getElementById("step3").classList.add("completed");
document.getElementById("step4").classList.add("active");
progressWidth=100;
}

document.getElementById("progressFill").style.width = progressWidth + "%";
}

function goBack(){
window.location.href="app.html";
}

</script>

</body>
</html>
