<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - WCF Performance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(180deg,#0b1220,#0a1a35);
color:white;
}

/* NAVBAR (tu gardes la même partout) */
nav{
background:#0c0f18;
padding:14px 28px;
display:flex;
gap:25px;
align-items:center;
border-bottom:1px solid #1d2746;
}
nav a{color:#cfd8ff;text-decoration:none}
nav a:hover{color:white}

/* PAGE */
.container{
max-width:900px;
margin:80px auto;
padding:40px;
background:#131c33;
border-radius:18px;
box-shadow:0 15px 60px rgba(0,0,0,.6);
text-align:center;
}

h1{
color:#ff2e2e;
margin-bottom:10px;
}

.subtitle{
color:#9fb0ff;
margin-bottom:35px;
}

/* FORM */
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

input, textarea{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #1f2c4f;
background:#0b1220;
color:white;
font-size:14px;
}

textarea{
grid-column:1 / -1;
resize:vertical;
min-height:100px;
}

.file{
margin-top:10px;
padding:14px;
background:#0b1220;
border:1px dashed #3a4d8f;
border-radius:12px;
}

button{
margin-top:20px;
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff2e2e,#ff6a00);
color:white;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:.2s;
}
button:hover{transform:scale(1.02)}

.whatsapp{
display:inline-block;
margin-top:18px;
background:#25D366;
padding:14px 24px;
border-radius:12px;
color:white;
text-decoration:none;
font-weight:600;
}

footer{
margin-top:60px;
text-align:center;
color:#6e7fb3;
}
</style>
</head>

<body>

<nav>
<a href="index.html">Accueil</a>
<a href="chiptuning.html">Chiptuning</a>
<a href="remote_support.html">Remote Support</a>
<a href="update.html">Software Update</a>
<a href="contact.html">Contact</a>
</nav>



<div class="container">

<h1>Envoyer un fichier</h1>
<p class="subtitle">Upload ORI / BIN / VR — réponse rapide</p>

<form action="https://formsubmit.co/wcfperformance@gmail.com" method="POST" enctype="multipart/form-data">

<input type="hidden" name="_subject" value="Nouveau fichier client WCF Performance">
<input type="hidden" name="_captcha" value="false">

<div class="form-grid">
<input name="Nom" placeholder="Nom / Garage" required>
<input name="Vehicule" placeholder="Véhicule (Marque Modèle Année)" required>
<input name="ECU" placeholder="Calculateur / ECU" required>
<input name="Outil" placeholder="Outil (Flex, Kess, SM2...)" required>
</div>

<textarea name="Demande" placeholder="Expliquez la demande"></textarea>

<div class="file">
<input type="file" name="file" required>
</div>

<button type="submit">Envoyer le fichier au serveur</button>

</form>

<a class="whatsapp" href="https://wa.me/message/NMAYVYZADORVF1">
Contacter directement sur WhatsApp
</a>

</div>

<footer>© WCF Performance</footer>

</body>
</html>
