<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - WCF Performance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins;background:#0b1220;color:white}

/* TOP BAR */
.topbar{
background: radial-gradient(circle at 30% 50%, rgba(255,0,0,.35), transparent 60%),
linear-gradient(90deg,#1a0000,#2b0000,#120000);
padding:18px 0;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.7)
}
.topbar img{height:60px;filter:drop-shadow(0 0 12px rgba(255,0,0,.6))}

/* NAVBAR */
nav{
background:#0a0a0c;
display:flex;align-items:center;gap:25px;
padding:14px 28px;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a
}
.logo{font-weight:800;color:#ff2e2e;font-size:22px}
nav a{color:#cfd8ff;text-decoration:none;font-size:14px}
nav a:hover{color:white}
.search{margin-left:auto;background:#0b1220;border:1px solid #1f2c4f;border-radius:10px;padding:8px 12px;color:white;width:200px}

/* CONTACT */
.container{max-width:900px;margin:60px auto;padding:0 20px;text-align:center}
h1{color:#ff2e2e}

.info{margin:30px 0;font-size:18px;color:#cfd8ff}

form{
background:#131c33;padding:30px;border-radius:18px;
box-shadow:0 10px 40px rgba(0,0,0,.6)
}

input,textarea{
width:100%;padding:14px;margin-top:12px;
border:none;border-radius:10px;background:#0b1220;color:white
}

button{
width:100%;padding:14px;margin-top:18px;
border:none;border-radius:12px;font-weight:600;
cursor:pointer;background:#25D366;color:white
}

.whatsapp{
display:inline-block;margin-top:30px;padding:15px 25px;
background:#25D366;border-radius:12px;color:white;text-decoration:none;font-weight:600
}

footer{text-align:center;padding:30px;color:#7e8bb8;margin-top:60px}
</style>
</head>

<body>

<div class="topbar">
<img src="logo.png">
</div>

<nav>
<div class="logo">WCF</div>
<a href="index.html">Accueil</a>
<a href="chiptuning.html">Chiptuning</a>
<a href="remote.html">Remote Support</a>
<a href="update.html">Software Update</a>
<a href="contact.html">Contact</a>
<input class="search" placeholder="Rechercher service...">
</nav>

<div class="container">
<h1>Contact & Assistance</h1>

<div class="info">
Disponible 7j/7 — réponse rapide<br>
Envoyez les informations du véhicule pour prise en charge
</div>

<form>
<input id="name" type="text" placeholder="Nom / Garage">
<input id="car" type="text" placeholder="Véhicule (Marque Modèle Année)">
<input id="ecu" type="text" placeholder="Calculateur / ECU">
<input id="tool" type="text" placeholder="Outil utilisé (Kess, Flex, SM2...)">
<textarea id="msg" rows="4" placeholder="Décrivez votre demande"></textarea>
<button type="button" onclick="sendWhatsApp()">Envoyer via WhatsApp</button>
</form>

<a class="whatsapp" href="https://wa.me/message/NMAYVYZADORVF1">
Contacter directement sur WhatsApp
</a>
</div>

<footer>© WCF Performance</footer>

<script>
function sendWhatsApp(){

let name = document.getElementById("name").value;
let car = document.getElementById("car").value;
let ecu = document.getElementById("ecu").value;
let tool = document.getElementById("tool").value;
let msg = document.getElementById("msg").value;

let text =
"Bonjour WCF Performance,%0A%0A" +
"Nom : " + name + "%0A" +
"Véhicule : " + car + "%0A" +
"ECU : " + ecu + "%0A" +
"Outil : " + tool + "%0A" +
"Demande : " + msg;

window.open("https://wa.me/message/NMAYVYZADORVF1?text=" + text, "_blank");
}
</script>

</body>
</html>
