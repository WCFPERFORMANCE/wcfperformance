<body>

<header>
<div class="logo">WCF <span>PERFORMANCE</span></div>
<nav>
<a href="index.html">Home</a>
<a href="ecu-file.html">ECU File Service</a>
<a href="remote.html">Remote Service</a>
<a href="software-install.html">Software Installation</a>
</nav>
</header>

<section class="hero">
<h1>ECU <span>FILE SERVICE</span></h1>
<p>Upload your original file and receive a professional solution</p>
</section>

<section class="form-section">
<div class="form-box">
<h2>Upload Your File</h2>

<form action="success.html" method="POST" enctype="multipart/form-data">

<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Email Address" required>
<input type="text" placeholder="Vehicle Model" required>
<input type="text" placeholder="ECU Type" required>

<div class="upload-box" id="uploadBox">
  <input type="file" id="file" hidden required>

  <div class="upload-content" id="uploadContent">
    <h3 id="uploadTitle">ECU FILE UPLOAD</h3>
    <p id="uploadSub">Drag & Drop file or click to browse</p>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
    <span id="progressText">0%</span>
  </div>
</div>

<button type="submit">SEND FILE</button>

</form>
</div>
</section>

<footer>
© WCF Performance — Professional ECU Solutions
</footer>

<script>
const fileInput = document.getElementById("file");
const fileText = document.getElementById("fileText");
const uploadLabel = document.getElementById("uploadLabel");

fileInput.addEventListener("change", function(){
  if(this.files.length > 0){
    fileText.textContent = this.files[0].name;
    uploadLabel.classList.add("active");
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "YOUR_PROJECT_URL";
const supabaseKey = "YOUR_PUBLIC_KEY";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("file");
const uploadTitle = document.getElementById("uploadTitle");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const progressContainer = document.getElementById("progressContainer");
const form = document.querySelector("form");

// Click
uploadBox.addEventListener("click", () => fileInput.click());

// Drag
uploadBox.addEventListener("dragover", e => {
  e.preventDefault();
  uploadBox.classList.add("active");
});

uploadBox.addEventListener("dragleave", () => {
  uploadBox.classList.remove("active");
});

uploadBox.addEventListener("drop", e => {
  e.preventDefault();
  fileInput.files = e.dataTransfer.files;
  uploadBox.classList.add("active");
  showFileName();
});

// File selected
fileInput.addEventListener("change", showFileName);

function showFileName(){
  if(fileInput.files.length > 0){
    uploadTitle.innerText = fileInput.files[0].name;
    uploadBox.classList.add("active");
  }
}

// Submit
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const file = fileInput.files[0];
  if(!file) return alert("Select a file");

  progressContainer.style.display = "block";

  const fileName = Date.now() + "_" + file.name;

  const { error } = await client.storage
    .from("ecu-files")
    .upload(fileName, file, {
      onUploadProgress: (progress) => {
        const percent = Math.round((progress.loaded / progress.total) * 100);
        progressBar.style.width = percent + "%";
        progressText.innerText = percent + "%";
      }
    });

  if(error){
    alert("Upload failed");
    return;
  }

  progressBar.style.width = "100%";
  progressText.innerText = "Upload Complete ✔";

  uploadBox.style.boxShadow = "0 0 40px rgba(0,255,0,.6)";
});
</script>
</body>
</html>
