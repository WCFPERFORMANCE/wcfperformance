<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECU File Service | WCF Performance</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
background:#0a0a0a;
color:#fff;
font-family:'Rajdhani',sans-serif;
margin:0;
}

header{
padding:15px 60px;
display:flex;
justify-content:space-between;
align-items:center;
background:#000;
}

.logo{
font-family:'Teko';
font-size:28px;
letter-spacing:2px;
}

.logo span{color:#ff2a2a;}

nav a{
margin-left:30px;
text-decoration:none;
color:#fff;
}

.hero{
padding:20px;
text-align:center;
}

.hero h1{
margin:0 0 10px;
font-family:'Teko';
font-size:64px;
letter-spacing:3px;
}

.hero span{color:#ff2a2a;}

.form-section{
display:flex;
justify-content:center;
padding:60px 20px 120px;
}

.form-box{
background:#111;
padding:40px;
border-radius:18px;
width:450px;
box-shadow:0 0 40px rgba(0,0,0,.6);
}

.form-box h2{
font-family:'Teko';
font-size:32px;
margin-bottom:25px;
text-align:center;
}

.form-box input{
width:100%;
padding:14px;
margin-bottom:15px;
background:#0d0d0d;
border:1px solid #222;
border-radius:8px;
color:#fff;
}

/* UPLOAD */

.upload-box{
position:relative;
margin:20px 0;
border:2px dashed #333;
border-radius:18px;
padding:40px 20px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.upload-box:hover{
border-color:#ff2a2a;
}

.upload-box.active{
border-color:#ff2a2a;
box-shadow:0 0 30px rgba(255,0,0,.4);
}

.upload-content h3{
font-family:'Teko';
letter-spacing:2px;
margin-bottom:6px;
font-size:22px;
}

.upload-content p{
font-size:14px;
color:#aaa;
}

.progress-container{
display:none;
margin-top:20px;
background:#111;
border-radius:8px;
overflow:hidden;
height:25px;
position:relative;
}

.progress-bar{
height:100%;
width:0%;
background:#ff2a2a;
transition:width .3s;
}

#progressText{
position:absolute;
width:100%;
text-align:center;
top:0;
left:0;
font-size:14px;
line-height:25px;
}

button{
width:100%;
padding:15px;
background:#ff2a2a;
border:none;
border-radius:8px;
color:#fff;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{opacity:.85;}

footer{
text-align:center;
padding:60px;
border-top:1px solid #111;
color:#888;
}
</style>
</head>

<body>

<header>
<div class="logo">WCF <span>PERFORMANCE</span></div>
<nav>
<a href="index.html">Home</a>
<a href="ecu-file.html">ECU File Service</a>
<a href="remote.html">Remote Service</a>
<a href="software-install.html">Software Installation</a>
</nav>
</header>

<section class="hero">
<h1>ECU <span>FILE SERVICE</span></h1>
<p>Upload your original file and receive a professional solution</p>
</section>

<section class="form-section">
<div class="form-box">
<h2>Upload Your File</h2>

<form id="uploadForm">

<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Email Address" required>
<input type="text" placeholder="Vehicle Model" required>
<input type="text" placeholder="ECU Type" required>

<div class="upload-box" id="uploadBox">
<input type="file" id="fileInput" hidden required>

<div class="upload-content">
<h3 id="uploadTitle">ECU FILE UPLOAD</h3>
<p>Drag & Drop file or click to browse</p>
</div>

<div class="progress-container" id="progressContainer">
<div class="progress-bar" id="progressBar"></div>
<span id="progressText">0%</span>
</div>
</div>

<button type="submit">SEND FILE</button>
</form>
</div>
</section>

<footer>
© WCF Performance — Professional ECU Solutions
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "YOUR_PROJECT_URL";
const supabaseKey = "YOUR_NEW_PUBLISHABLE_KEY";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const uploadTitle = document.getElementById("uploadTitle");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const progressContainer = document.getElementById("progressContainer");
const form = document.getElementById("uploadForm");

uploadBox.addEventListener("click", () => fileInput.click());

uploadBox.addEventListener("dragover", e => {
e.preventDefault();
uploadBox.classList.add("active");
});

uploadBox.addEventListener("dragleave", () => {
uploadBox.classList.remove("active");
});

uploadBox.addEventListener("drop", e => {
e.preventDefault();
fileInput.files = e.dataTransfer.files;
uploadBox.classList.add("active");
showFileName();
});

fileInput.addEventListener("change", showFileName);

function showFileName(){
if(fileInput.files.length > 0){
uploadTitle.innerText = fileInput.files[0].name;
uploadBox.classList.add("active");
}
}

form.addEventListener("submit", async (e)=>{
e.preventDefault();

const file = fileInput.files[0];
if(!file) return alert("Select a file");

progressContainer.style.display = "block";

const fileName = Date.now()+"_"+file.name;

const { error } = await client.storage
.from("ecu-files")
.upload(fileName, file);

if(error){
alert("Upload failed");
return;
}

progressBar.style.width = "100%";
progressText.innerText = "Upload Complete ✔";
uploadBox.style.boxShadow = "0 0 40px rgba(0,255,0,.6)";
});
</script>

</body>
</html>
